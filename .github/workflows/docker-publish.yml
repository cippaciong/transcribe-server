name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Serialize publishing, including branch/tag pushes and manual reruns.
concurrency:
  group: docker-publish
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
    steps:
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing commit image
        id: existing
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if digest=$(docker buildx imagetools inspect "$IMAGE:$COMMIT_SHA" --format '{{.Manifest.Digest}}'); then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.existing.outputs.digest == ''
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and push commit image
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tag:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image tag
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=latest
          if [[ "$REF_TYPE" == 'tag' ]]; then
            tag="$REF_NAME"
          else
            # A delayed run or rerun of an old commit must not roll latest back.
            main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
            if [[ "$COMMIT_SHA" != "$main_sha" ]]; then
              echo "Skipping latest: $COMMIT_SHA is no longer the head of main."
              exit 0
            fi
          fi
          docker buildx imagetools create --prefer-index=false \
            --tag "$IMAGE:$tag" "$IMAGE@$DIGEST"
